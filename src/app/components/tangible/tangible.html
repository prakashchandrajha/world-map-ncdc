<app-banner
  [titleText]="'tangible.title' | translate"
  [titleText2]="'tangible.subtitle' | translate"
  ></app-banner>
<p class="mt-10 text-center text-gray-700 text-lg font-[Poppins] max-w-6xl mx-auto mb-6">
{{ 'tangible.description' | translate }}
</p><section
  class="flex justify-center items-start py-10 px-6   mt-20"
>
<p></p>
  <div
    class="w-full max-w-6xl bg-white rounded-2xl shadow-xl p-8 border-4 border-transparent bg-clip-border"
    style="border-image: linear-gradient(135deg, #7a004a, #ff77a9) 1"
  >


    <!-- Filters Row -->
    <div
      class="flex flex-wrap justify-center gap-6 mb-8 text-gray-700 text-base"
    >
      <!-- Year -->
      <div class="w-full md:w-60">
        <label class="block mb-2 font-medium text-gray-600">{{ 'tangible.year' | translate }}</label>
        <select
          [(ngModel)]="selectedYear"
          (change)="onFilterChange()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#7a004a] focus:outline-none"
        >
          <option value="">{{ 'tangible.all_years' | translate }}</option>
          @for (year of years; track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>

      <!-- Continent -->
      <div class="w-full md:w-60">
        <label class="block mb-2 font-medium text-gray-600">{{ 'tangible.continent' | translate }}</label>
        <select
          [(ngModel)]="selectedContinent"
          (change)="onFilterChange()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#7a004a] focus:outline-none"
        >
          <option value="">{{ 'tangible.all_continents' | translate }}</option>
          @for (continent of continents; track continent) {
            <option [value]="continent">{{ continent }}</option>
          }
        </select>
      </div>

      <!-- Country -->
      <div class="w-full md:w-60">
        <label class="block mb-2 font-medium text-gray-600">{{ 'tangible.country' | translate }}</label>
        <select
          [(ngModel)]="selectedCountry"
          (change)="onFilterChange()"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-[#7a004a] focus:outline-none"
        >
          <option value="">{{ 'tangible.all_countries' | translate }}</option>
          @for (country of countries; track country) {
            <option [value]="country">{{ country }}</option>
          }
        </select>
      </div>

      <!-- Apply Button -->
      <div class="w-full md:w-auto flex items-end">
        <button
          (click)="applyFilters()"
          class="px-8 py-2 font-medium text-white rounded-lg bg-gradient-to-r from-[#7a004a] to-[#ff77a9] hover:brightness-110 transition-all shadow-md"
        >
{{ 'tangible.apply_filters' | translate }}
        </button>
      </div>
    </div>

<section class="flex justify-center items-center px-4 mt-[100px]">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-6xl">

    <!-- Loop through Tangible Heritage cards -->
    @for (card of cards; track $index) {
      <app-heritage-card [card]="card"></app-heritage-card>
    }

  </div>
</section>
