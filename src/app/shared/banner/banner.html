<div
  class="relative w-full h-[180px] sm:h-[220px] md:h-[250px] lg:h-[280px] mt-10 bg-cover bg-center flex items-center overflow-hidden shadow-md"
  [ngStyle]="{
    'background-image': 'url(' + centerImage + ')'
  }"
>
  <!-- ✨ Light overlay (very subtle, optional) -->
  <div class="absolute inset-0 bg-black/10"></div>

  <!-- Text Section -->
  <div
    class="relative z-10 px-6 sm:px-10 md:px-16 text-white max-w-[90%] sm:max-w-[60%]"
  >
    <h2
      class="ml-30 mt-10 text-xl sm:text-2xl md:text-3xl font-semibold tracking-wide leading-snug "
      [innerHTML]="titleText"
    ></h2>

    <h2
      class="ml-30 text-base sm:text-lg md:text-xl font-medium tracking-wide leading-snug"
      [innerHTML]="titleText2"
    ></h2>
  </div>
</div>
