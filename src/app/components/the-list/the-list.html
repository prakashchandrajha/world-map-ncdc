<h1 class="text-center text-5xl md:text-3xl font-bold bg-gradient-to-r from-[#7a004a] to-gray-200 text-transparent bg-clip-text">
  <span [innerHTML]="translate('theList.expression.title')"></span>
</h1>



<p class="text-center text-2xl text-black mt-10">
  <span [innerHTML]="translate('theList.expression.description')"></span>
</p>
<div class="boxes-section w-full min-h-screen flex flex-col items-center justify-center py-10">
  <div class="px-4 md:px-[2rem] xl:px-[6rem] flex flex-col lg:flex-row gap-10 w-full">
    <!-- Left Column: Boxes -->
<div class="lg:w-[50%] xl:w-[50%] flex flex-col space-y-6 cursor-pointer" >
      <!-- Top Box -->
      <div class="heritage-box bg-[#7a004a] text-white rounded-xl p-20 flex items-start space-x-4 w-full" routerLink="/tangible">
        <img src="../../../assets/images/Logo.png" alt="Icon" class="w-20 h-20 object-contain flex-shrink-0">
        <div class="min-w-0">
          <h2 class="text-2xl font-bold mb-1 truncate"><span [innerHTML]="translate('theList.expression.tangible.title')"></span></h2>
          <p class="text-lg break-words"><span [innerHTML]="translate('theList.expression.tangible.description')"></span></p>
        </div>
      </div>
      <!-- Bottom Box -->
      <div class="heritage-box bg-gradient-to-r from-sky-400 to-blue-300 text-gray-800 rounded-xl p-20 flex items-start space-x-4 w-full" >
        <img src="../../../assets/images/Logo.png" alt="Icon" class="w-20 h-20 object-contain flex-shrink-0">
        <div class="min-w-0">
          <h2 class="text-2xl font-bold mb-1 truncate"><span [innerHTML]="translate('theList.expression.intangible.title')"></span></h2>
          <p class="text-lg break-words"><span [innerHTML]="translate('theList.expression.intangible.description')"></span></p>
        </div>
      </div>
    </div>

    <!-- Right Column: Blog List -->
    <div class="lg:w-[50%] xl:w-[50%] flex flex-col items-stretch justify-center">

        <span [innerHTML]="translate('theList.expression.recognition.title')"></span>
      </h2>
      <div class="flex flex-col gap-6">
        <div class="flex items-start gap-4">
          <span class="text-[#7a004a] text-3xl font-bold">1.</span>
          <p class="text-black text-lg"><span [innerHTML]="translate('theList.expression.recognition.points[0]')"></span></p>
        </div>
        <div class="flex items-start gap-4">

          <p class="text-black text-lg"><span [innerHTML]="translate('theList.expression.recognition.points[1]')"></span></p>

      <!-- Image (touches bottom, smaller height) -->

        src="../../../assets/images/ujm.png"

        class="relative z-10 h-60 w-60 object-contain transform transition-transform duration-500 scale-120  "
      >
    </div>

    <!-- Text Section -->

      <!-- Main heading -->

        <span [innerHTML]="translate('theList.checklist.assessment.title')"></span>
      </h3>

      </h4>

        <label class="inline-flex items-center justify-center space-x-2 cursor-pointer">
          <input type="radio" name="heritage" class="text-[#7a004a] focus:ring-[#7a004a]">
          <span class="text-gray-700 text-sm"><span [innerHTML]="translate('theList.checklist.assessment.options[0]')"></span></span>

        <label class="inline-flex items-center justify-center space-x-2 cursor-pointer">
          <input type="radio" name="heritage" class="text-[#7a004a] focus:ring-[#7a004a]">
          <span class="text-gray-700 text-sm"><span [innerHTML]="translate('theList.checklist.assessment.options[1]')"></span></span>
        </label>
      </div>
