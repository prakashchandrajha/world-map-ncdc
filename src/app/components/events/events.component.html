<!-- cooperative-events.component.html -->

<app-banner
  [titleText]="'events.title' | translate"
  ></app-banner>
<div class="min-h-screen mt-20 bg-gradient-to-br from-gray-50 to-blue-50 py-12 px-4 sm:px-6 lg:px-8 ">
  <div class="max-w-6xl mx-auto">
    
    <!-- Header Section -->
    <div class="text-center mb-16">
      <!-- <h1 class="text-4xl md:text-5xl font-bold text-[#7a004a] mb-6">
        Cooperative Cultural Heritage Events
      </h1> -->
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-lg border border-gray-100">
        <p class="text-lg text-gray-700 leading-relaxed mb-6">
          {{ 'events.description' | translate }}
        </p>
        
        <!-- Submit Event Section -->
        <div class="md:flex bg-white rounded-xl shadow-md overflow-hidden">
  <div class="md:shrink-0">
    <img class="h-48 w-full object-cover md:h-full md:w-48" src="../../../assets/images/sites_files/eve.png" alt="Event Image">
  </div>
  <div class="p-8">
    <div class="uppercase tracking-wide text-sm font-semibold text-[#7a004a]">
  <h3 class="text-xl font-bold mb-3">{{ 'events.have_event' | translate }}</h3>
</div>

    <p class="mt-2 text-slate-600 leading-relaxed">
      {{ 'events.submit_description' | translate }}
    </p>
    <p class="mt-4 text-slate-700">
      <span class="font-semibold">{{ 'events.contact_text' | translate }}</span>
      <a href="mailto:kumar@ica.coop" class="text-[#7a004a] font-medium hover:underline">{{ 'events.contact_email' | translate }}</a>
    </p>
  </div>
</div>


        <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl">
    
</div>
      </div>
    </div>

    <!-- Events Accordion -->
    <div class="space-y-4">
      <div *ngFor="let event of events" class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
        <!-- Accordion Header -->
        <div
          class="bg-gradient-to-r from-[#7a004a] to-[#9c005d] p-4 cursor-pointer hover:from-[#9c005d] hover:to-[#7a004a] transition-all duration-300"
          (click)="toggleEvent(event.id)"
        >
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <div class="bg-white text-[#7a004a] text-center rounded-xl px-4 py-2 shadow-md">
                <div class="text-2xl font-bold leading-tight">{{ event.date }}</div>
                <div class="text-sm font-semibold tracking-wide uppercase">{{ event.month }}</div>
                <div class="text-xs text-gray-500">{{ event.year }}</div>
              </div>
              <div class="text-white">
                <span class="font-semibold text-lg">{{ event.title }}</span>
              </div>
            </div>
            <div class="text-white">
              <svg
                class="w-6 h-6 transform transition-transform duration-300"
                [class.rotate-180]="openEventId === event.id"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Accordion Content -->
        <div
          class="overflow-hidden transition-all duration-300 ease-in-out"
          [class.max-h-0]="openEventId !== event.id"
          [class.max-h-screen]="openEventId === event.id"
        >
          <div class="p-6" [innerHTML]="event.content"></div>
        </div>
      </div>
    </div>
  </div>
</div>
