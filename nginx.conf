# Nginx configuration for Angular SPA - Cooperative Culture Heritage
# Server: ica5.gn.apc.org
# Document Root: /var/www/html
#
# Add this configuration to your Nginx server block at:
# /etc/nginx/sites-available/default or /etc/nginx/sites-available/cooperative-culture-heritage

server {
    listen 80;
    listen [::]:80;
    server_name ica5.gn.apc.org;  # Your server hostname
    root /var/www/html;           # Your document root from deployment script
    index index.html;

    # Handle Angular routing - THIS IS THE KEY FIX FOR 404 ERRORS
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle assets directory
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|bmp|tiff|tif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Handle i18n files
    location ~* /assets/i18n/.*\.json$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/atom+xml
        image/svg+xml;

    # Optional: Handle API routes (uncomment if you have backend API)
    # location /api {
    #     proxy_pass http://your-backend-server;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Error and access logs
    error_log /var/log/nginx/cooperative-culture-heritage_error.log;
    access_log /var/log/nginx/cooperative-culture-heritage_access.log;
}

